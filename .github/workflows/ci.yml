name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Build & Test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: kakeibo
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    LANG: C.UTF-8
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: corretto
                  java-version: 17
                  cache: gradle

            - name: Grant execute permission
              run: chmod +x gradlew

            - name: Build
              run: ./gradlew build -x test

            - name: Test
              run: ./gradlew test
              env:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kakeibo
                  SPRING_DATASOURCE_USERNAME: postgres
                  SPRING_DATASOURCE_PASSWORD: postgres

    frontend:
        name: Frontend Lint & Build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build
